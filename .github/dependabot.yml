# Dependabot: 使っている部品に新しい版や脆弱性の直しが出たら、GitHub が PR を作ってくれる。
# PR が多くなりすぎないように、週に 1 回、小さな更新（minor / patch）はまとめて 1 つの PR にする。
version: 2
updates:
  # 部品本体
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # 見本のページ
  - package-ecosystem: npm
    directory: /examples/web
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions（CI で使っている actions/checkout など）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
